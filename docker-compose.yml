# Local stack: API + PostgreSQL + Redis + Celery worker + Celery beat.
# Copy .env.example to .env first, then run: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: users_api
      POSTGRES_PASSWORD: users_api
      POSTGRES_DB: users_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_api"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      # Override hosts so the app reaches the service containers, and run
      # migrations on startup for this service only.
      DATABASE_URL: postgresql+asyncpg://users_api:users_api@db:5432/users_api
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://users_api:users_api@db:5432/users_api
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.tasks.celery_app.celery_app worker -l info
    depends_on:
      - db
      - redis

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://users_api:users_api@db:5432/users_api
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.tasks.celery_app.celery_app beat -l info
    depends_on:
      - db
      - redis

volumes:
  pgdata:
